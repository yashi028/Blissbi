<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Blissbi — Skincare that gets to know you</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe3e9;--card:#fff;--ink:#2b2628;--mute:#7a6f72;--blush:#f6d5dc;--pink:#e8a9b8;--line:#eadfd9;--dot:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=cream]{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b2628;--mute:#7a6f72;--blush:#f1e1e1;--pink:#d99aab;--line:#e7ddd4;--dot:#2b262822}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 5px,transparent 5.6px) 0 0/36px 36px;background-attachment:fixed;color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif;padding-bottom:80px}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.05;margin:0}
h1{font-size:clamp(2.6rem,8vw,5.2rem)}h2{font-size:clamp(2rem,5vw,3rem)}h3{font-size:1.5rem}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.wrap{max-width:1040px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.tg{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:5px 12px;font:500 .78rem 'DM Sans';cursor:pointer;margin-right:10px}.logo{font-family:'Cormorant Garamond',serif;font-size:1.7rem;letter-spacing:.12em;cursor:pointer}
nav .links{display:flex;gap:22px;font-size:.9rem}nav a,.tab{cursor:pointer;color:var(--mute);text-decoration:none}nav a.on,nav a:hover{color:var(--ink)}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20;font-size:.72rem}
.tabbar a{text-align:center;cursor:pointer;color:var(--mute)}.tabbar a.on{color:var(--ink)}.tabbar b{display:block;font-size:1.1rem}
@media(max-width:720px){nav .links{display:none}.tabbar{display:flex}}
.btn{border:0;border-radius:99px;padding:14px 26px;font:600 .95rem 'DM Sans';cursor:pointer;background:var(--ink);color:var(--bg);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0002}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 6px 24px #e8a9b822;transition:.3s}.card:hover{transform:translateY(-3px)}
.dots{background:var(--blush) radial-gradient(var(--dot) 4px,transparent 4.6px) 0 0/26px 26px}
.pinkband{background:var(--pink) radial-gradient(#fff 6px,transparent 6.6px) 0 0/34px 34px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:56px 0;min-height:78vh}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:30px}}
.hero p{max-width:480px;color:var(--mute);font-size:1.1rem}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.art{position:relative;aspect-ratio:1;max-width:440px;margin:auto;width:100%}
.art .blob{position:absolute;inset:8%;border-radius:48% 52% 45% 55%;background:#fff radial-gradient(#e8a9b840 3px,transparent 3.6px) 0 0/24px 24px,radial-gradient(#e8a9b840 3px,transparent 3.6px) 12px 12px/24px 24px;box-shadow:0 0 0 8px #ffffffaa}
.star{position:absolute;filter:drop-shadow(0 4px 6px #0003);animation:fl 5s ease-in-out infinite;cursor:pointer}.star:hover{transform:scale(1.2) rotate(20deg)}
@keyframes fl{50%{translate:0 -14px;rotate:8deg}}
.ly2{position:absolute;left:0;bottom:14%;width:36%;rotate:-8deg;animation:sway 9s ease-in-out infinite;filter:drop-shadow(0 8px 12px #8a2f5033)}.lily{position:absolute;top:4%;right:0;width:44%;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 6px 10px #e8a9b855)}.patch{position:absolute;bottom:0;left:44%;width:17%;rotate:18deg;filter:drop-shadow(0 4px 8px #e8a9b866);cursor:default}.star img:hover{filter:brightness(1.15)}@keyframes sway{50%{transform:rotate(5deg) scale(1.03)}}
.hand{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--pink);font-size:1.3rem;position:absolute;rotate:-6deg}
section{padding:48px 0}.card{border-color:#fff}.pinkband .serif{color:var(--ink)}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{display:block;width:100%;text-align:left;padding:16px 20px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;font:inherit;color:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--pink)}.opt.sel{background:var(--blush);border-color:var(--pink);transform:scale(1.02)}
.prog{height:3px;background:var(--line);border-radius:3px;margin:10px 0 28px}.prog i{display:block;height:100%;background:var(--pink);border-radius:3px;transition:.4s}
.fade{animation:fd .45s ease}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step .n{font-family:'Cormorant Garamond';font-size:1.6rem;color:var(--pink);min-width:38px}
.step small{color:var(--mute);display:block}.tag{display:inline-block;background:var(--blush);border-radius:99px;padding:3px 12px;font-size:.8rem;margin:3px 3px 0 0}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none;background:none;color:var(--ink)}
.chk.on{background:var(--ink);color:var(--bg);animation:pop .35s}@keyframes pop{50%{transform:scale(1.35)}}
input,textarea,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%}label{font-size:.85rem;color:var(--mute)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:13px 20px;font:600 .9rem 'DM Sans';cursor:pointer;box-shadow:0 8px 24px #0004}
@media(min-width:721px){.fab{bottom:24px}}
.chat{position:fixed;right:18px;bottom:calc(140px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 36px));height:min(460px,60vh);background:var(--card);border:1px solid var(--line);border-radius:24px;z-index:30;display:none;flex-direction:column;box-shadow:0 20px 50px #0003}
@media(min-width:721px){.chat{bottom:80px}}.chat.open{display:flex}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.m{padding:10px 14px;border-radius:16px;max-width:85%;font-size:.92rem}
.m.b{background:var(--blush);align-self:flex-start}.m.u{background:var(--ink);color:var(--bg);align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.chips span{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer}
.disc{font-size:.78rem;color:var(--mute);border-top:1px solid var(--line);padding:24px 0;margin-top:40px}
.bst{position:fixed;pointer-events:none;color:var(--pink);font-size:20px;animation:bs .9s forwards;z-index:50}@keyframes bs{to{transform:translate(var(--x),var(--y)) rotate(180deg);opacity:0}}
.tl{display:flex;gap:16px;padding:8px 0;border-bottom:1px dashed var(--line)}.tl b{min-width:78px;font-family:'Cormorant Garamond';font-size:1.2rem}
.wk{display:flex;gap:8px}.wk div{flex:1;text-align:center;font-size:.75rem;border:1px solid var(--line);border-radius:14px;padding:8px 0}
</style></head><body>

// ---- rule-based layer ----
function derive(a){
 const sk=a.skin||'',type=sk.startsWith('Tight')?'Dry':sk=='Comfortable'?'Normal':sk=='Oily'?'Oily':sk.startsWith('Oily in')?'Combination':(a.oil=='Within 2 hours'?'Oily-leaning':'Combination-leaning');
 const c=a.concerns||[],high=a.sens=='Very sensitive',tm=a.time||'',mins=tm.startsWith('2')?3:tm.startsWith('5')?7:tm.startsWith('10')?12:15;
 const pref=a.pref||'Minimal',pores=c.some(x=>['Acne','Comedones','Blackheads','Whiteheads'].includes(x));
 let target='Niacinamide',why='A gentle multitasker that may support the skin barrier and the look of excess oil.';
 if(pores&&!high){target='Salicylic acid (BHA)';why='May help with the look of clogged pores. Start slowly, 2 nights a week.'}
 else if(c.includes('Fine lines')&&!high&&pref!='Minimal'){target='Retinoid';why='Commonly used for texture and fine lines but needs careful, gradual introduction.'}
 else if(c.includes('Dryness'))target='Hyaluronic acid';
 const pri=[type.startsWith('Dry')?'Hydrate':'Balance',high?'Soothe':'Hydrate','Protect'];
 const ing=[['Niacinamide',4,'Supports the skin barrier and may help with the appearance of excess oil.'],['Hyaluronic acid',4,'A hydration-focused humectant that suits most skin types.'],['Salicylic acid',pores&&!high?3:2,'May be useful when pores feel clogged. Not for every night.'],['Retinoids',c.includes('Fine lines')||pores?3:2,'Commonly used for texture concerns, but needs careful introduction and professional guidance.']];
 const am=[['Cleanse','Remove overnight oil without stripping.'],['Hydrate','Support the barrier and keep moisture in.']];
 if(pref!='Minimal'&&mins>=7&&!high)am.push(['Target','Niacinamide — lightweight and daytime friendly.']);
 am.push(['Protect','SPF 30+ daily. Consistency matters most.']);
 const pm=[['Cleanse','Remove SPF, oil and the day.'],['Target',target+' — '+why],['Hydrate','Replenish water after your active.'],['Barrier support','A simple moisturizer to seal it in.']];
 if(mins<5)pm.splice(1,1);
 const compat=target.startsWith('Salic')?'Use salicylic acid on two non-consecutive nights. Skip retinoids and other exfoliants on those nights.':target=='Retinoid'?'Retinoids go on at night only, starting twice a week. Avoid exfoliating acids on the same night.':'Niacinamide pairs well with most things, so there is no tricky scheduling.';
 return{type,c,high,mins,pref,target,why,pri,ing,am,pm,compat,life:a.life||[],goal:a.goal};
}
const adjust=(m)=>['Irritated','Dry','Breakout-prone'].includes(m)?{simple:1,msg:m=='Dry'?'Your skin feels dry today. Blissbi suggests a hydration-first night: Cleanse → Hydrate → Moisturize, with your active moved to another day.':m=='Irritated'?'Your skin feels more sensitive today. Keep tonight simple: Cleanse → Hydrate → Moisturize. Your active treatment has been moved to another day. If irritation is severe or lasts, please see a dermatologist.':'A breakout-prone day: stay gentle tonight (Cleanse → Hydrate → Moisturize) and avoid layering extra actives. Be patient and consistent.'}:{simple:0,msg:m?'Great, keep going with your routine as planned ✦':''};
// ---- schedule ----
const T=(m)=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mi=m%60;return(h%12||12)+':'+String(mi).padStart(2,'0')+(h<12?' AM':' PM')};
const mm=t=>{const[h,m]=t.split(':');return+h*60+ +m};
function buildSched(f){
 const p=S.p||derive(S.ans),w=mm(f.wake),sl=mm(f.sleep),mt=+f.mTime,nt=+f.nTime;
 const mor=mt<5?['Cleanse','Moisturize + SPF']:['Cleanse','Hydrate',...(mt>=8&&p.pref!='Minimal'?['Target']:[]),'SPF'];
 const nig=nt>=10?['Cleanse','Treatment','Hydrate','Moisturizer']:['Cleanse','Treatment','Moisturizer'];
 const notes=[];if(mt<5)notes.push('Short morning, so your routine is trimmed to the essentials.');if(nt>mt+4)notes.push('More time at night, so treatments live in your evening routine.');if(f.ex=='Yes')notes.push('After workouts, rinse your face gently and re-apply moisturizer.');if(f.tr=='Yes')notes.push('Travelling? Pack just a cleanser, moisturizer and SPF.');
 let t=w;const m=[[T(t),'Wake up']];t+=5;mor.forEach(s=>{m.push([T(t),s]);t+=Math.max(1,Math.round(mt/mor.length))});m.push([T(t+5),'Get ready']);
 let n=sl-30-nt;const ni=[];nig.forEach(s=>{ni.push([T(n),s]);n+=Math.max(2,Math.round(nt/nig.length))});ni.push([T(n),'Done ✦']);
 return{m,ni,notes};
}
// ---- AI service layer (swap body for an LLM call later) ----
function ai(q){
 q=q.toLowerCase();const p=S.p;
 if(/severe|swelling|pain|spreading|allergic|worsening|pus|bleeding/.test(q))return'That sounds like something to have looked at. I can’t diagnose skin conditions, so please see a dermatologist or healthcare professional soon, especially if it’s painful, swollen or getting worse quickly. 🤍';
 if(/niacinamide/.test(q))return'For most people, yes — niacinamide is generally gentle enough for daily use. Start every other day for a week, watch how your skin feels, and build up. If you get stinging or redness, step back.';
 if(/salicylic|bha/.test(q))return'Salicylic acid is an oil-soluble exfoliant that may help with the look of clogged pores. Begin with 2 nights a week, keep it away from retinoids on the same night, and always use SPF the next morning.';
 if(/retinoid|retinol/.test(q))return'Retinoids are commonly used for texture and fine lines, but they need a slow start: pea-sized amount, 2 nights a week, buffered with moisturizer. A dermatologist can guide stronger options.';
 if(/dry|tight/.test(q))return'Tightness after cleansing often means your cleanser is a bit too strong. Try a gentler, creamy one, hydrate on damp skin and pause actives for a few days. Still tight after a week? Tell me and we’ll adjust.';
 if(/5 min|five|quick|rush|short/.test(q))return'Easy: Cleanse → Moisturize → SPF in the morning, and Cleanse → Moisturize at night. Consistency beats complexity ✦';
 if(/forgot|missed/.test(q))return'No stress — missing a morning doesn’t undo anything. Do a quick moisturizer + SPF now and carry on tonight as usual.';
 if(/tonight|evening|night/.test(q)){const a=adjust(S.mood);return a.simple?a.msg:'Tonight: Cleanse → '+(p?p.target:'Niacinamide')+' (if it’s an active night) → Hydrate → Moisturizer. Keep it calm ✦'}
 if(/spf|sunscreen/.test(q))return'SPF helps protect against sun damage and supports every other goal, including dark spots. Use SPF 30+ every morning.';
 return'I’m here for routines, ingredients and schedules. Try asking about niacinamide, how to fit skincare into a busy day, or what to do tonight.';
}

const V={
home:()=>`<div class="wrap"><div class="hero fade"><div><div class="eyebrow">Your AI skincare companion</div><h1 style="margin:14px 0 18px">Your skin has a story.<br><i>Let’s get to know it.</i></h1><p>Answer a few questions and Blissbi will build a skincare routine around your skin, your lifestyle, and your everyday life.</p><div class="row"><button class="btn" onclick="go('quiz')">Meet my skin →</button><button class="btn ghost" onclick="document.getElementById('how').scrollIntoView({behavior:'smooth'})">Explore Blissbi</button></div></div>
<div class="art" id="art"><div class="blob"></div><img class="ly2" alt="Burgundy lily" src="${IMG.ly2}"><img class="lily" alt="Pink lily" src="${IMG.lily}"><img class="patch star" alt="Small pink lily" src="${IMG.lily}"><span class="star" style="top:0;left:6%">${STAR(58)}</span><span class="star" style="bottom:2%;right:8%;animation-delay:-2s">${STAR(44)}</span><span class="star" style="top:44%;right:-2%;animation-delay:-3s">${STAR(30)}</span><span class="hand" style="top:48%;left:0">hello, skin ♡</span></div></div></div>
<div class="pinkband"><div class="wrap" style="padding:36px 20px;text-align:center"><div class="serif" style="font-size:clamp(1.5rem,4vw,2.3rem);background:var(--bg);display:inline-block;padding:8px 26px;border-radius:99px">Consistency over complexity ✦ Understanding over hype</div></div></div>
<section id="how"><div class="wrap"><div class="eyebrow">How it works</div><h2 style="margin:8px 0 28px">Quiz → routine → life.</h2><div class="grid">${[['01','Take the quiz','Ten gentle questions that feel like a chat.'],['02','Meet your skin','A plain-language profile and ingredient education.'],['03','Fit it into your day','A schedule built around your wake-up, classes and sleep.'],['04','Check in daily','Blissbi adapts when your skin feels different.']].map(x=>`<div class="card"><div class="serif" style="font-size:2.4rem;color:var(--pink)">${x[0]}</div><h3>${x[1]}</h3><p style="color:var(--mute);margin:6px 0 0">${x[2]}</p></div>`).join('')}</div></div></section>${disc()}`,
quiz:()=>{const[q,k,o,multi]=Q[S.q],cur=S.ans[k]||(multi?[]:'');return`<div class="wrap fade" style="max-width:640px;padding-top:36px"><div class="eyebrow">${String(S.q+1).padStart(2,'0')} — ${Q.length}</div><div class="prog"><i style="width:${(S.q+1)/Q.length*100}%"></i></div><span style="float:right">${STAR(36,S.q%2?'silver':'pink')}</span><h2 style="margin-bottom:8px">${q}</h2>${multi?'<p style="color:var(--mute);margin:0">Choose all that apply.</p>':''}<div style="margin:18px 0">${o.map(x=>`<button class="opt ${(multi?cur.includes(x):cur==x)?'sel':''}" onclick="pick('${k}','${x.replace(/'/g,"\\'")}',${!!multi})">${x}</button>`).join('')}</div><div class="row">${S.q?'<button class="btn ghost" onclick="S.q--;render()">← Back</button>':''}<button class="btn" onclick="nextQ()">${S.q==Q.length-1?'Finish ✦':'Continue →'}</button></div></div>`},
analysis:()=>`<div class="wrap" style="max-width:520px;text-align:center;padding-top:80px"><span class="star" style="position:static;display:inline-block">${STAR(70)}</span><h2 style="margin:14px 0 24px">Getting to know your skin…</h2><div id="steps" style="text-align:left"></div></div>`,
profile:()=>{if(!S.p)return need();const p=S.p,name=ST('name')||'you',h=new Date().getHours();const days=['MON','TUE','WED','THU','FRI'];const wk=ST('wk')||[1,1,0,1,1];
 const blk=(t,arr,k)=>`<div class="card"><h3>${t}</h3>${arr.map((s,i)=>`<div class="step" style="align-items:center"><button class="chk ${S.done[k+i]?'on':''}" onclick="tick('${k+i}',event)">${S.done[k+i]?'✓':''}</button><div>${s[0]}</div></div>`).join('')}</div>`;
 const ad=adjust(S.mood);
 return`<div class="wrap fade" style="padding-top:36px"><div class="eyebrow">Your Blissbi profile</div><h1 style="font-size:clamp(2.2rem,6vw,3.8rem);margin:8px 0 6px">Good ${h<12?'morning':h<18?'afternoon':'evening'}, <span onclick="rename()" title="Tap to change name" style="cursor:pointer;border-bottom:2px dotted var(--pink)">${name}</span> ✦</h1><h2 style="color:var(--pink);font-style:italic;margin-bottom:26px">Meet your skin.</h2>
<div class="grid"><div class="card"><div class="eyebrow">Skin type</div><h3 style="font-size:2.2rem">${p.type}</h3>${p.c.map(c=>`<span class="tag">${c}</span>`).join('')||'<span class="tag">Balance</span>'}${p.high?'<span class="tag">Sensitive</span>':''}</div>
<div class="card"><div class="eyebrow">Priorities</div>${p.pri.map((x,i)=>`<div class="serif" style="font-size:1.6rem">0${i+1} — ${x}</div>`).join('')}</div>
<div class="card"><div class="eyebrow">Lifestyle</div>${(p.life.length?p.life:['Everyday life']).map(x=>`<div>${x}</div>`).join('')}<div style="color:var(--mute);margin-top:8px">Routine style: ${p.pref}</div></div></div>
<div class="card dots" style="margin:16px 0"><div class="hand" style="position:static;rotate:0deg">a little note</div><p style="font-size:1.05rem;margin:6px 0">Based on your answers, your skin appears to behave like <b>${p.type.toLowerCase()}</b> skin. ${p.type.startsWith('Comb')?'Some areas may produce more oil while others stay balanced or dry. ':''}A routine focused on gentle cleansing, lightweight hydration and consistent sun protection may suit you better than many strong actives at once. ${p.high?'Because your skin is sensitive, we’ll introduce one active at a time. ':''}This is general education, not a diagnosis.</p></div>
<h2 style="margin:36px 0 14px">Today’s routine</h2><div class="grid">${blk('Morning',p.am,'a')}${blk('Evening',p.pm,'p')}</div>
<div class="card" style="margin:16px 0"><h3>How is your skin feeling today?</h3><div class="row" style="margin:12px 0">${['Calm','Dry','Oily','Irritated','Breakout-prone','Normal'].map(m=>`<button class="opt ${S.mood==m?'sel':''}" style="width:auto;margin:0;padding:8px 16px" onclick="mood('${m}')">♡ ${m}</button>`).join('')}</div>${ad.msg?`<div class="m b" style="max-width:100%">${ad.msg}</div>`:''}</div>
<div class="card"><h3>This week</h3><div class="wk" style="margin-top:10px">${days.map((d,i)=>`<div>${d}<br>${wk[i]?'✓':'○'}</div>`).join('')}</div><p style="color:var(--mute);margin:10px 0 0">4 of 5 days — consistency is the goal, not perfection ✦</p></div></div>${disc()}`},
routine:()=>{if(!S.p)return need();const p=S.p,ad=adjust(S.mood);const rt=(t,a)=>`<div class="card"><h2>${t}</h2>${a.map((s,i)=>`<div class="step"><div class="n">0${i+1}</div><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}</div>`;
 return`<div class="wrap fade" style="padding-top:36px"><div class="eyebrow">Your routine</div><h1 style="font-size:clamp(2.2rem,6vw,3.6rem);margin:6px 0 20px">Simple, on purpose.</h1>${ad.simple?`<div class="card" style="background:var(--blush);margin-bottom:16px">✦ ${ad.msg}</div>`:''}<div class="grid">${rt('AM',p.am)}${rt('PM',ad.simple?[['Cleanse','Gentle only.'],['Hydrate','Water-based hydration.'],['Moisturize','Seal it in.']]:p.pm)}</div>
<div class="card" style="margin:16px 0"><h3>Compatibility note</h3><p style="margin:6px 0;color:var(--mute)">${p.compat} Introduce one new active at a time and give it 2 weeks.</p></div>
<h2 style="margin:36px 0 6px">Your potential matches</h2><p style="color:var(--mute)">Ingredient education based on your answers, not medical prescriptions.</p><div class="grid">${p.ing.map(i=>`<div class="card"><h3>${i[0]}</h3><div style="color:var(--pink);letter-spacing:3px">${'★'.repeat(i[1])}${'☆'.repeat(5-i[1])}</div><p style="margin:6px 0 0;color:var(--mute)">${i[2]}</p></div>`).join('')}</div></div>${disc()}`},
schedule:()=>{const f=ST('sf')||{wake:'07:00',leave:'08:00',sleep:'23:00',mTime:'8',nTime:'10',ex:'No',tr:'No'};const s=S.sched;
 const tl=a=>a.map(x=>`<div class="tl"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 return`<div class="wrap fade" style="padding-top:36px"><div class="eyebrow">Schedule builder</div><h1 style="font-size:clamp(2.2rem,6vw,3.6rem);margin:6px 0 20px">Fit it into your life.</h1><div class="card"><div class="f2">${[['wake','Wake up','time'],['leave','Leave home','time'],['sleep','Sleep','time'],['mTime','Morning minutes','number'],['nTime','Night minutes','number']].map(x=>`<div><label>${x[1]}</label><input id="f_${x[0]}" type="${x[2]}" value="${f[x[0]]}"></div>`).join('')}<div><label>Exercise?</label><select id="f_ex"><option>No</option><option ${f.ex=='Yes'?'selected':''}>Yes</option></select></div><div><label>Travel often?</label><select id="f_tr"><option>No</option><option ${f.tr=='Yes'?'selected':''}>Yes</option></select></div></div><div class="row"><button class="btn" onclick="mk()">Build my skincare schedule ✦</button></div></div>
${s?`<div class="grid" style="margin-top:16px"><div class="card"><h2>Your morning</h2>${tl(s.m)}</div><div class="card"><h2>Your night</h2>${tl(s.ni)}</div></div>${s.notes.length?`<div class="card" style="margin-top:16px;background:var(--blush)">${s.notes.map(n=>'✦ '+n).join('<br>')}</div>`:''}`:''}</div>${disc()}`},
journal:()=>`<div class="wrap fade" style="padding-top:36px"><div class="eyebrow">Your skin diary</div><h1 style="font-size:clamp(2.2rem,6vw,3.6rem);margin:6px 0 20px">Notice, don’t judge.</h1><div class="grid"><div class="card"><h3>Today’s entry</h3><label>Skin feeling</label><select id="jf">${['Calm','Dry','Oily','Irritated','Breakout-prone','Normal'].map(x=>`<option>${x}</option>`).join('')}</select><label>Notes / products used</label><textarea id="jn" rows="3" placeholder="What did you notice today?"></textarea><div class="row"><button class="btn" onclick="addJ()">Save entry ♡</button></div></div>
<div class="card dots"><h3>Last 4 weeks</h3>${[['Hydration','↑ improving'],['Texture','→ stable'],['Breakouts','↓ decreasing']].map(t=>`<div class="tl"><b style="font-size:1.1rem;min-width:100px">${t[0]}</b>${t[1]}</div>`).join('')}<p style="font-size:.8rem;color:var(--mute)">Personal tracking only, not a clinical assessment.</p></div></div>
<h2 style="margin:32px 0 12px">Entries</h2>${S.diary.slice().reverse().map(e=>`<div class="card" style="margin-bottom:10px;padding:16px"><span class="tag">${e.feel}</span> <span style="color:var(--mute)">${e.d}</span><div>${e.note||'—'}</div></div>`).join('')}</div>${disc()}`,
discover:()=>{const t=[['What is your skin barrier?','The outer layer that keeps moisture in and irritants out. Gentle care keeps it happy.'],['What does hydration mean?','Water content in the skin. Different from oil, so even oily skin can be dehydrated.'],['What is a comedone?','A clogged pore. Open ones are blackheads, closed ones are whiteheads.'],['What does SPF do?','Helps protect against UV damage — the daily step that supports every other goal.'],['What does niacinamide do?','A gentle vitamin B3 that may support the barrier and the look of oil and texture.'],['What does salicylic acid do?','An oil-soluble exfoliant that may help with the look of clogged pores.'],['What are retinoids?','Vitamin A derivatives used for texture and fine lines. Start low and slow.'],['Why introduce actives slowly?','So you can tell what’s working and avoid overloading your barrier.']];
 return`<div class="wrap fade" style="padding-top:36px"><div class="eyebrow">Skincare 101</div><h1 style="font-size:clamp(2.2rem,6vw,3.6rem);margin:6px 0 24px">Understand your skin<br><i>before you treat it.</i></h1><div class="grid">${t.map((x,i)=>`<div class="card ${i%3==1?'dots':''}"><span style="float:right">${STAR(28,i%2?'silver':'pink')}</span><div class="serif" style="font-size:1.5rem;color:var(--pink)">0${i+1}</div><h3>${x[0]}</h3><p style="color:var(--mute);margin:8px 0 0">${x[1]}</p></div>`).join('')}</div></div>${disc()}`}};
// ---- actions ----
let route='home';
function setTheme(t){document.documentElement.dataset.theme=t;ST('theme',t);const b=$('#tg');if(b)b.textContent=t=='cream'?'● Pink dots':'○ Cream';}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=='cream'?'pink':'cream')}
function go(r){route=r;location.hash=r;if(r=='quiz'){S.q=0}render();scrollTo(0,0)}
function render(){chrome(route);$('#app').innerHTML=(V[route]||V.home)();if(route=='analysis')runAnalysis()}
function pick(k,v,multi){if(multi){const a=S.ans[k]||[];S.ans[k]=a.includes(v)?a.filter(x=>x!=v):[...a,v]}else S.ans[k]=v;render()}
function nextQ(){const k=Q[S.q][1];if(!S.ans[k]||!S.ans[k].length){S.ans[k]=Q[S.q][3]?[]:S.ans[k];if(!Q[S.q][3]){return}}
 if(S.q<Q.length-1){S.q++;render();scrollTo(0,0)}else{ST('ans',S.ans);go('analysis')}}
function runAnalysis(){const st=['Reading your answers','Understanding your skin profile','Mapping your concerns','Building your routine','Creating your schedule'];let i=0;const el=$('#steps');
 const t=setInterval(()=>{if(i<st.length){el.innerHTML+=`<div class="fade" style="padding:6px 0">✓ ${st[i++]}</div>`}else{clearInterval(t);S.p=derive(S.ans);ST('p',S.p);el.innerHTML+=`<h3 style="margin:22px 0 12px">Your Blissbi profile is ready ✦</h3><button class="btn" onclick="go('profile')">Meet my skin →</button>`}},550)}
function tick(k,e){S.done[k]=!S.done[k];ST('done',S.done);if(S.done[k])burst(e.clientX,e.clientY);render()}
function burst(x,y){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='bst';s.textContent='✦';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',Math.cos(i)*50+'px');s.style.setProperty('--y',Math.sin(i)*50+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function rename(){const n=prompt('What should Blissbi call you?');if(n){ST('name',n.slice(0,24));render()}}
function mood(m){S.mood=m;ST('mood',m);render()}
function mk(){const f={};['wake','leave','sleep','mTime','nTime','ex','tr'].forEach(k=>f[k]=$('#f_'+k).value);ST('sf',f);S.sched=buildSched(f);ST('sched',S.sched);render()}
function addJ(){S.diary.push({d:new Date().toLocaleDateString('en',{weekday:'short'}),feel:$('#jf').value,note:$('#jn').value});ST('diary',S.diary);render()}
function bub(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d}
function toggleChat(){$('#chat').classList.toggle('open');if(!$('#msgs').children.length)bub('Hi, I’m Blissbi ✦ Ask me about routines, ingredients, or what to do tonight. I share general skincare education, not medical advice.','b')}
function send(t){const v=t||$('#ci').value.trim();if(!v)return;$('#ci').value='';bub(v,'u');const a=ai(v),d=bub('…','b');let i=0;const tm=setInterval(()=>{d.textContent=a.slice(0,i+=3);$('#msgs').scrollTop=1e9;if(i>=a.length)clearInterval(tm)},18)}
document.addEventListener('click',e=>{if(e.target.closest('.chips span'))send(e.target.textContent)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')send()});
document.addEventListener('mousemove',e=>{const a=$('#art');if(a)a.style.transform=`translate(${(e.clientX/innerWidth-.5)*10}px,${(e.clientY/innerHeight-.5)*10}px)`});
route=(location.hash||'#home').slice(1);if(!V[route]&&route!='analysis')route='home';render();setTheme(ST('theme')||'pink');
</script></body></html>
